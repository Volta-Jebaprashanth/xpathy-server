# default port (will be overridden by GUI)
server.port=8080
spring.main.web-application-type=servlet

# MCP server exposed on the same port via Streamable HTTP transport (endpoint: /mcp)
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=xpathy-server
spring.ai.mcp.server.version=3.0.2
spring.ai.mcp.server.instructions=Converts human-friendly XPathy Java snippets into XPath expressions. \
  Use the execute_xpathy tool with a snippet such as id.contains("id-1") to get back the equivalent XPath.
